<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Alfa — Transferência de Barris</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qr-scanner/1.4.2/qr-scanner.umd.min.js"></script>
<style>
  :root{
    --bg:#161009;
    --surface:#211809;
    --surface-2:#2b1f0f;
    --amber:#e3a83b;
    --amber-dark:#b9862a;
    --text:#f5ead9;
    --muted:#af9c81;
    --danger:#c0392b;
    --success:#5c9a52;
    --border:#3a2c17;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    min-height:100vh;
  }
  #app{max-width:520px;margin:0 auto;padding:16px 16px 40px;}
  header{
    display:flex;align-items:baseline;justify-content:space-between;
    padding:14px 4px 18px;border-bottom:1px solid var(--border);margin-bottom:18px;
  }
  header .brand{font-size:1.4rem;font-weight:800;letter-spacing:0.5px;color:var(--amber);}
  header .sub{font-size:0.78rem;color:var(--muted);}
  .view{display:none;}
  .view.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  h2{font-size:1.15rem;margin:0 0 16px;color:var(--text);}
  h3{font-size:0.95rem;margin:18px 0 8px;color:var(--muted);font-weight:600;}

  .big-btn{
    display:block;width:100%;padding:18px 16px;margin-bottom:12px;
    background:var(--amber);color:#1a1206;border:none;border-radius:var(--radius);
    font-size:1.05rem;font-weight:700;cursor:pointer;text-align:center;
  }
  .big-btn:active{background:var(--amber-dark);}
  .big-btn.secondary{background:var(--surface-2);color:var(--amber);border:1px solid var(--amber-dark);}
  .link-btn{
    display:block;width:100%;text-align:center;background:none;border:none;
    color:var(--muted);padding:10px;font-size:0.9rem;cursor:pointer;margin-top:4px;
  }

  .employee-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .emp-btn{
    padding:20px 8px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);color:var(--text);font-size:1.05rem;font-weight:600;cursor:pointer;
  }
  .emp-btn:active{border-color:var(--amber);}
  #emp-outro-input{
    width:100%;padding:14px;margin-bottom:14px;border-radius:var(--radius);
    border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:1rem;
  }

  .scan-header{display:flex;justify-content:space-between;font-size:0.82rem;color:var(--muted);margin-bottom:10px;}
  .camera-wrap{
    position:relative;width:100%;aspect-ratio:1/1;background:#000;border-radius:var(--radius);
    overflow:hidden;border:1px solid var(--border);margin-bottom:10px;
  }
  #video{width:100%;height:100%;object-fit:cover;display:block;}
  #scan-flash{
    position:absolute;inset:0;background:var(--success);opacity:0;pointer-events:none;transition:opacity .15s;
  }
  #scan-flash.on{opacity:.35;}
  #scan-toast{
    position:absolute;left:8px;right:8px;bottom:8px;background:rgba(20,15,8,.88);
    color:var(--text);padding:10px 12px;border-radius:10px;font-size:0.92rem;font-weight:600;
    opacity:0;transform:translateY(6px);transition:all .2s;pointer-events:none;text-align:center;
  }
  #scan-toast.show{opacity:1;transform:none;}
  #scan-toast.error{background:rgba(120,30,20,.9);}

  .manual-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;}
  .manual-btn{
    padding:10px 4px;font-size:0.78rem;line-height:1.3;background:var(--surface);
    border:1px solid var(--border);border-radius:10px;color:var(--text);cursor:pointer;
  }
  .manual-btn:active{border-color:var(--amber);}

  .tally-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:14px;}
  .tally-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);}
  .tally-row:last-child{border-bottom:none;}
  .tally-name{flex:1;font-size:0.92rem;}
  .tally-count{font-size:0.9rem;color:var(--amber);font-weight:700;min-width:52px;text-align:right;}
  .mini-btn{
    width:30px;height:30px;border-radius:8px;border:1px solid var(--border);
    background:var(--surface-2);color:var(--text);font-size:1.1rem;cursor:pointer;line-height:1;
  }
  .empty{color:var(--muted);font-size:0.9rem;text-align:center;padding:10px 0;}
  #totals-bar{text-align:center;padding-top:10px;font-size:1rem;color:var(--text);}

  #summary-text{
    white-space:pre-wrap;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:16px;font-size:0.92rem;line-height:1.55;margin-bottom:16px;
    font-family:inherit;
  }

  table#labels-config{width:100%;border-collapse:collapse;margin-bottom:16px;font-size:0.85rem;}
  table#labels-config th,table#labels-config td{padding:6px 4px;border-bottom:1px solid var(--border);text-align:center;}
  table#labels-config th:first-child,table#labels-config td:first-child{text-align:left;}
  .qty-input{width:48px;padding:6px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);text-align:center;}

  #labels-sheet{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
  .label-card{
    border:1px dashed var(--border);border-radius:8px;padding:8px;text-align:center;
    background:#fff;color:#111;page-break-inside:avoid;
  }
  .qr-box{display:flex;justify-content:center;margin-bottom:6px;}
  .label-style{font-weight:700;font-size:0.85rem;}
  .label-vol{font-size:1.3rem;font-weight:800;color:#7a4e0f;}
  .label-brand{font-size:0.65rem;letter-spacing:1px;color:#999;margin-top:4px;}

  @media print{
    body *{visibility:hidden;}
    #labels-sheet, #labels-sheet *{visibility:visible;}
    #labels-sheet{position:absolute;top:0;left:0;width:100%;grid-template-columns:repeat(3,1fr);}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="brand">ALFA</span>
    <span class="sub">Transferência de Barris</span>
  </header>

  <section id="view-home" class="view active">
    <button class="big-btn" id="go-scan">📦 Transferência de Barris</button>
    <button class="big-btn secondary" id="go-labels">🏷️ Gerar Etiquetas</button>
  </section>

  <section id="view-employee" class="view">
    <h2>Quem está fazendo a transferência?</h2>
    <div class="employee-grid">
      <button class="emp-btn" data-name="João">João</button>
      <button class="emp-btn" data-name="Vanderson">Vanderson</button>
      <button class="emp-btn" data-name="Brasileiro">Brasileiro</button>
      <button class="emp-btn" data-name="Elmir">Elmir</button>
      <button class="emp-btn" data-name="Marcos">Marcos</button>
      <button class="emp-btn" id="emp-outro">Outro</button>
    </div>
    <input type="text" id="emp-outro-input" placeholder="Digite o nome e aperte Enter" style="display:none">
    <button class="link-btn" id="emp-back">‹ Voltar</button>
  </section>

  <section id="view-scan" class="view">
    <div class="scan-header">
      <span id="scan-employee-label"></span>
      <span id="scan-datetime"></span>
    </div>
    <div class="camera-wrap">
      <video id="video" playsinline muted></video>
      <div id="scan-flash"></div>
      <div id="scan-toast"></div>
    </div>
    <button class="link-btn" id="manual-toggle">Adicionar manualmente</button>
    <div class="manual-grid" id="manual-grid" style="display:none"></div>
    <div class="tally-wrap">
      <h3 style="margin-top:0">Escaneados nesta transferência</h3>
      <div id="tally-list"></div>
      <div id="totals-bar"></div>
    </div>
    <button class="big-btn" id="btn-finish">Finalizar e Gerar Resumo</button>
    <button class="link-btn" id="scan-back">‹ Cancelar</button>
  </section>

  <section id="view-summary" class="view">
    <h2>Resumo da Transferência</h2>
    <div id="summary-text"></div>
    <button class="big-btn secondary" id="btn-copy">Copiar</button>
    <button class="big-btn" id="btn-whatsapp">Enviar por WhatsApp</button>
    <button class="link-btn" id="btn-new">Novo registro</button>
  </section>

  <section id="view-labels" class="view">
    <h2>Gerar Etiquetas para Impressão</h2>
    <p style="color:var(--muted);font-size:0.85rem;margin-top:-10px;">Defina quantas etiquetas de cada estilo/volume você precisa e gere a folha para imprimir e recortar.</p>
    <table id="labels-config"></table>
    <button class="big-btn" id="labels-generate">Gerar Folha de Etiquetas</button>
    <button class="big-btn secondary" id="labels-print" style="display:none">Imprimir</button>
    <div id="labels-sheet"></div>
    <button class="link-btn" id="labels-back">‹ Voltar</button>
  </section>
</div>

<script>
const STYLES = [
  {code:'OKTOBER', name:'Oktober'},
  {code:'SOFT-PILSEN', name:'Soft Pilsen'},
  {code:'CAP-LAGER', name:'Capunga Lager'},
  {code:'CAP-PMALTE', name:'Capunga Puro Malte'},
  {code:'CUMADE', name:'IPA Cumade'},
  {code:'BALA-DIPA', name:'Bala de Prata DIPA'},
  {code:'BABYLON-IPA', name:'IPA Babylon'},
  {code:'GERMAN-LAGER', name:'German Lager'},
  {code:'NECTAR-ROXO', name:'Néctar Roxo'},
  {code:'SPRING', name:'Spring'},
  {code:'BOSSA', name:'Bossa'},
  {code:'EKAUT-PILSEN', name:'Ekäut Pilsen'}
];
const VOLUMES = [20, 30, 50];

function qrText(code, vol){ return 'ALFA:' + code + ':' + vol + 'L'; }
function styleName(code){ const s = STYLES.find(function(s){return s.code===code;}); return s ? s.name : code; }

let employeeName = '';
let scans = [];
let lastScanKey = null, lastScanTime = 0;
let qrScanner = null;
let sessionStart = null;

function showView(id){
  document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
}

function updateDatetime(){
  const now = new Date();
  document.getElementById('scan-datetime').textContent =
    now.toLocaleDateString('pt-BR') + ' ' + now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

function startTransfer(name){
  employeeName = name;
  scans = [];
  sessionStart = new Date();
  document.getElementById('scan-employee-label').textContent = 'Funcionário: ' + name;
  updateDatetime();
  renderTally();
  showView('view-scan');
  startCamera();
}

function startCamera(){
  const video = document.getElementById('video');
  if(qrScanner){ qrScanner.destroy(); qrScanner = null; }
  try{ QrScanner.WORKER_PATH = 'https://cdnjs.cloudflare.com/ajax/libs/qr-scanner/1.4.2/qr-scanner-worker.min.js'; }catch(e){}
  qrScanner = new QrScanner(video, handleDecode, {
    highlightScanRegion: true,
    highlightCodeOutline: true,
    maxScansPerSecond: 5,
    preferredCamera: 'environment'
  });
  qrScanner.start().catch(function(){
    showToast('Câmera indisponível — use "Adicionar manualmente"', true);
    document.getElementById('manual-grid').style.display = 'grid';
    document.getElementById('manual-toggle').textContent = 'Ocultar lista manual';
  });
}

function stopCamera(){
  if(qrScanner){ qrScanner.stop(); }
}

function handleDecode(result){
  const text = (typeof result === 'string') ? result : result.data;
  if(!text) return;
  const m = /^ALFA:([A-Z0-9\-]+):(\d+)L$/.exec(text.trim());
  if(!m){ return; }
  const code = m[1], vol = parseInt(m[2],10);
  const key = code + '-' + vol;
  const now = Date.now();
  if(key === lastScanKey && (now - lastScanTime) < 1500){ return; }
  lastScanKey = key; lastScanTime = now;
  addScan(code, vol);
}

function addScan(code, vol){
  vol = parseInt(vol,10);
  scans.push({code:code, vol:vol, ts:new Date()});
  renderTally();
  flashFeedback(styleName(code) + ' ' + vol + 'L');
  beep();
  if(navigator.vibrate) navigator.vibrate(80);
}

function flashFeedback(label){
  const el = document.getElementById('scan-toast');
  el.textContent = '✓ ' + label;
  el.classList.remove('error');
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.classList.remove('show'); }, 1200);
  const flash = document.getElementById('scan-flash');
  flash.classList.add('on');
  setTimeout(function(){ flash.classList.remove('on'); }, 200);
}

function showToast(msg, isError){
  const el = document.getElementById('scan-toast');
  el.textContent = msg;
  el.classList.toggle('error', !!isError);
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.classList.remove('show'); }, 2500);
}

function beep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.value = 0.08;
    o.start(); o.stop(ctx.currentTime + 0.1);
  }catch(e){}
}

function groupedTally(){
  const map = {};
  scans.forEach(function(s){
    const key = s.code + '-' + s.vol;
    if(!map[key]) map[key] = {code:s.code, vol:s.vol, count:0};
    map[key].count++;
  });
  return Object.values(map).sort(function(a,b){
    return styleName(a.code).localeCompare(styleName(b.code)) || a.vol - b.vol;
  });
}

function renderTally(){
  const list = document.getElementById('tally-list');
  const groups = groupedTally();
  if(groups.length === 0){
    list.innerHTML = '<p class="empty">Nenhum barril escaneado ainda</p>';
  } else {
    list.innerHTML = groups.map(function(g){
      return '<div class="tally-row">' +
        '<span class="tally-name">' + styleName(g.code) + ' ' + g.vol + 'L</span>' +
        '<span class="tally-count">' + g.count + ' un.</span>' +
        '<button class="mini-btn" onclick="decScan(\'' + g.code + '\',' + g.vol + ')">−</button>' +
        '<button class="mini-btn" onclick="incScan(\'' + g.code + '\',' + g.vol + ')">+</button>' +
        '</div>';
    }).join('');
  }
  const totalBarris = scans.length;
  const totalLitros = scans.reduce(function(sum,s){ return sum + s.vol; }, 0);
  document.getElementById('totals-bar').innerHTML =
    '<strong>' + totalBarris + '</strong> barris &nbsp;•&nbsp; <strong>' + totalLitros + '</strong> litros';
}

function incScan(code, vol){ addScan(code, vol); }
function decScan(code, vol){
  vol = parseInt(vol,10);
  const idx = scans.map(function(s){ return s.code+'-'+s.vol; }).lastIndexOf(code+'-'+vol);
  if(idx > -1) scans.splice(idx,1);
  renderTally();
}

function buildManualGrid(){
  const grid = document.getElementById('manual-grid');
  let html = '';
  STYLES.forEach(function(s){
    VOLUMES.forEach(function(v){
      html += '<button class="manual-btn" onclick="addScan(\'' + s.code + '\',' + v + ')">' + s.name + '<br>' + v + 'L</button>';
    });
  });
  grid.innerHTML = html;
}

// wiring
document.getElementById('go-scan').onclick = function(){ showView('view-employee'); };
document.getElementById('go-labels').onclick = function(){ buildLabelsConfig(); showView('view-labels'); };
document.getElementById('emp-back').onclick = function(){ showView('view-home'); };
document.getElementById('labels-back').onclick = function(){ showView('view-home'); };

document.querySelectorAll('.emp-btn[data-name]').forEach(function(btn){
  btn.onclick = function(){ startTransfer(btn.dataset.name); };
});
document.getElementById('emp-outro').onclick = function(){
  const input = document.getElementById('emp-outro-input');
  input.style.display = 'block';
  input.focus();
  input.onkeydown = function(e){
    if(e.key === 'Enter' && input.value.trim()){ startTransfer(input.value.trim()); }
  };
};

document.getElementById('manual-toggle').onclick = function(){
  const grid = document.getElementById('manual-grid');
  const showing = grid.style.display !== 'none';
  grid.style.display = showing ? 'none' : 'grid';
  this.textContent = showing ? 'Adicionar manualmente' : 'Ocultar lista manual';
};

document.getElementById('scan-back').onclick = function(){
  if(scans.length > 0 && !confirm('Cancelar vai descartar os itens escaneados. Confirma?')) return;
  stopCamera();
  showView('view-home');
};

document.getElementById('btn-finish').onclick = function(){
  if(scans.length === 0){ showToast('Escaneie ao menos 1 barril antes de finalizar', true); return; }
  stopCamera();
  buildSummary();
  showView('view-summary');
};

function buildSummary(){
  const groups = groupedTally();
  const now = new Date();
  const dateStr = sessionStart.toLocaleDateString('pt-BR');
  const startStr = sessionStart.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  const endStr = now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  const totalBarris = scans.length;
  const totalLitros = scans.reduce(function(s,x){ return s+x.vol; }, 0);
  let text = '📦 TRANSFERÊNCIA FÁBRICA → ESTOQUE\n';
  text += 'Funcionário: ' + employeeName + '\n';
  text += 'Data: ' + dateStr + ' | ' + startStr + ' às ' + endStr + '\n\n';
  groups.forEach(function(g){
    text += '• ' + styleName(g.code) + ' ' + g.vol + 'L: ' + g.count + ' un. (' + (g.count*g.vol) + 'L)\n';
  });
  text += '\nTOTAL: ' + totalBarris + ' barris | ' + totalLitros + ' litros';
  document.getElementById('summary-text').textContent = text;
}

document.getElementById('btn-copy').onclick = function(){
  const text = document.getElementById('summary-text').textContent;
  navigator.clipboard.writeText(text).then(function(){
    showSummaryToast('Copiado!');
  }).catch(function(){
    showSummaryToast('Não foi possível copiar automaticamente — selecione o texto manualmente.');
  });
};

function showSummaryToast(msg){
  const btn = document.getElementById('btn-copy');
  const original = btn.textContent;
  btn.textContent = msg;
  setTimeout(function(){ btn.textContent = original; }, 1500);
}

document.getElementById('btn-whatsapp').onclick = function(){
  const text = document.getElementById('summary-text').textContent;
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
};
document.getElementById('btn-new').onclick = function(){ showView('view-home'); };

// LABELS
function buildLabelsConfig(){
  const table = document.getElementById('labels-config');
  let html = '<tr><th>Estilo</th><th>20L</th><th>30L</th><th>50L</th></tr>';
  STYLES.forEach(function(s){
    html += '<tr><td>' + s.name + '</td>';
    VOLUMES.forEach(function(v){
      html += '<td><input type="number" min="0" value="10" data-code="' + s.code + '" data-vol="' + v + '" class="qty-input"></td>';
    });
    html += '</tr>';
  });
  table.innerHTML = html;
}

document.getElementById('labels-generate').onclick = function(){
  const sheet = document.getElementById('labels-sheet');
  sheet.innerHTML = '';
  let idx = 0;
  document.querySelectorAll('.qty-input').forEach(function(input){
    const qty = parseInt(input.value,10) || 0;
    const code = input.dataset.code, vol = input.dataset.vol;
    for(let i=0;i<qty;i++){
      idx++;
      const div = document.createElement('div');
      div.className = 'label-card';
      const qrId = 'qr-' + idx;
      div.innerHTML = '<div class="qr-box" id="' + qrId + '"></div>' +
        '<div class="label-style">' + styleName(code) + '</div>' +
        '<div class="label-vol">' + vol + 'L</div>' +
        '<div class="label-brand">ALFA</div>';
      sheet.appendChild(div);
      new QRCode(document.getElementById(qrId), {
        text: qrText(code, vol), width:100, height:100, correctLevel: QRCode.CorrectLevel.M
      });
    }
  });
  document.getElementById('labels-print').style.display = idx > 0 ? 'block' : 'none';
};
document.getElementById('labels-print').onclick = function(){ window.print(); };

buildManualGrid();
</script>
</body>
</html>
